# Private deployment baseline; supply actual paths/network/IDs via an untracked .env.
services:
  growbook:
    build: .
    env_file: "${GROWBOOK_ENV_FILE:-.env}"
    environment:
      DJANGO_SETTINGS_MODULE: growbook.settings.production
      GROWBOOK_DATA_DIR: /data
    user: "${APP_UID:?Set a non-root APP_UID}:${APP_GID:?Set APP_GID}"
    volumes:
      - "${APP_DATA_PATH:?Set a host-local private data path}:/data"
    networks:
      - managed-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Deliberately no ports, public DNS, or bundled reverse-proxy service.
networks:
  managed-proxy:
    external: true
    name: "${PROXY_NETWORK:?Set the private managed proxy network}"
