name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"
  UV_LOCKED: "true"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Check dependency lockfile
        run: uv lock --check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build development and test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: development
          load: true
          push: false
          provenance: false
          tags: growbook:development
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=ci-development
          cache-to: type=gha,scope=ci-development,mode=max
          github-token: ""
      - name: Lint and check formatting
        run: |
          docker compose -f compose.development.yaml run --rm app ruff check .
          docker compose -f compose.development.yaml run --rm app ruff format --check .
      - name: Check translations, database configuration, and migrations
        run: |
          docker compose -f compose.development.yaml run --rm app python tools/compile_translations.py
          docker compose -f compose.development.yaml run --rm app python manage.py check --database default
          docker compose -f compose.development.yaml run --rm app python manage.py makemigrations --check --dry-run
      - name: Check the local development startup path
        run: |
          docker compose -f compose.development.yaml up -d --no-build app
          docker compose -f compose.development.yaml exec -T app python tools/check_development.py
      - name: Run application tests
        run: docker compose -f compose.development.yaml run --rm app python tools/run_tests.py -q --durations=20
      - name: Stop development containers
        if: always()
        run: docker compose -f compose.development.yaml down

  styles:
    name: Styles (Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned frontend toolchain
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://registry.npmjs.org/pnpm/-/pnpm-11.28.5.tgz \
            --output "$RUNNER_TEMP/pnpm.tgz"
          printf '%s  %s\n' \
            '1ef4e447a68713656064f3f174c0f44719960a043a3fe2299169d08cf1dbf8ee' \
            "$RUNNER_TEMP/pnpm.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/pnpm"
          tar -xzf "$RUNNER_TEMP/pnpm.tgz" -C "$RUNNER_TEMP/pnpm"
          node "$RUNNER_TEMP/pnpm/package/bin/pnpm.mjs" install --frozen-lockfile
      - name: Verify the committed stylesheet
        run: |
          node "$RUNNER_TEMP/pnpm/package/bin/pnpm.mjs" run build:css
          git diff --exit-code -- static/css/app.css

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build development and test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: development
          load: true
          push: false
          provenance: false
          tags: growbook:development
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=ci-development
          github-token: ""
      - name: Run browser tests
        run: docker compose -f compose.development.yaml run --rm app python tools/run_tests.py -q -m browser -n 4 --dist worksteal --durations=20
      - name: Stop development containers
        if: always()
        run: docker compose -f compose.development.yaml down

  container:
    name: Container (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Set up uv for dependency auditing
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Audit locked Python and build dependencies
        run: |
          uv export --locked --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/audit-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --strict \
            --progress-spinner off -r "$RUNNER_TEMP/audit-requirements.txt" -r requirements-build.txt
      - name: Validate compose files
        env:
          APP_UID: "1000"
          APP_GID: "1000"
          APP_DATA_PATH: /tmp/growbook-data
          PROXY_NETWORK: proxy
          GROWBOOK_ENV_FILE: ${{ runner.temp }}/compose.env
        run: |
          cp .env.example "$GROWBOOK_ENV_FILE"
          docker compose config -q
          docker compose -f compose.yaml -f compose.host-port.yaml config -q
          docker compose -f compose.development.yaml config -q
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: growbook:ci
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=ci-production-amd64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=ci-production-amd64,mode=max' || '' }}
          github-token: ""
      - name: Check the production image as its runtime user
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp \
            growbook:ci python tools/check_image.py
      - name: Audit production image
        run: bash tools/audit_image.sh growbook:ci

  container-arm64:
    # aarch64 is built natively rather than emulated, so this leg proves the arm64 image
    # installs, decodes HEIC and passes the runtime checks on its own architecture. The
    # release workflow restores this leg's cache scope for its arm64 build; a cache is
    # scoped to the ref that wrote it, so main is the only place a release tag can read it.
    name: Container (Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: growbook:ci
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=ci-production-arm64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=ci-production-arm64,mode=max' || '' }}
          github-token: ""
      - name: Check the production image as its runtime user
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp \
            growbook:ci python tools/check_image.py
      - name: Audit production image
        run: bash tools/audit_image.sh growbook:ci
