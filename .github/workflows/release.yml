name: Release image

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  guard:
    # Tag pushes create stable releases; manual prereleases and tag deletions are skipped.
    if: >-
      (github.event_name == 'push' && !github.event.deleted) ||
      (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
    env:
      # The Git tag is the release version; no package-version bump is required.
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a stable tag on a tested main commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_CREATED: ${{ github.event.created }}
        run: python3 tools/publish_release.py --check
      - name: Refuse to overwrite an existing version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          owner=${GITHUB_REPOSITORY%/*}
          package=${GITHUB_REPOSITORY#*/}
          if gh api --paginate "users/$owner/packages/container/${package,,}/versions" \
            --jq '.[].metadata.container.tags[]' > "$RUNNER_TEMP/image-tags" 2> "$RUNNER_TEMP/registry-error"; then
            if grep -Fxq "$VERSION" "$RUNNER_TEMP/image-tags"; then
              echo "Image version already exists; create a new release instead." >&2
              exit 1
            fi
          else
            # Before the first publication, the package does not exist yet.
            grep -Fq '(HTTP 404)' "$RUNNER_TEMP/registry-error"
          fi

  build:
    # Each platform is built, checked and described on its own native runner: no
    # emulation, and each platform has its own build cache scope.
    needs: guard
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the staging directory
        shell: bash
        # One directory holds everything the publish job needs from this platform.
        run: mkdir -p "$RUNNER_TEMP/release-$SUFFIX"
      - name: Build the image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ needs.guard.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GROWBOOK_VERSION=${{ needs.guard.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
          # A release ignores the build cache on purpose: the published image must carry the
          # Debian packages that are current at release time instead of layers an earlier CI
          # run cached. The scope below is kept as it was and no longer supplies layers.
          no-cache: true
          cache-from: type=gha,scope=ci-production-${{ matrix.suffix }}
          github-token: ""
      - name: Check the image and generate its SBOM
        shell: bash
        env:
          IMAGE: ${{ needs.guard.outputs.image }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.guard.outputs.version }}
          SBOM: ${{ runner.temp }}/release-${{ matrix.suffix }}/sbom-${{ matrix.suffix }}.spdx.json
          PLATFORM: ${{ matrix.platform }}
        run: bash tools/check_release_image.sh
      - name: Record the digest for publishing
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/release-$SUFFIX/digest-$SUFFIX"
      - name: Hand the platform digest and SBOM to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.suffix }}
          path: ${{ runner.temp }}/release-${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect the platform digests and SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/platforms
          merge-multiple: true
      - name: Read the platform digests
        id: digests
        shell: bash
        env:
          PLATFORMS: ${{ runner.temp }}/platforms
        run: |
          for suffix in amd64 arm64; do
            digest=$(cat "$PLATFORMS/digest-$suffix")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Unexpected $suffix digest: $digest" >&2
              exit 1
            fi
            printf '%s=%s\n' "$suffix" "$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested index
        id: push
        shell: bash
        env:
          IMAGE: ${{ needs.guard.outputs.image }}
          VERSION: ${{ needs.guard.outputs.version }}
          AMD64: ${{ steps.digests.outputs.amd64 }}
          ARM64: ${{ steps.digests.outputs.arm64 }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published %s for linux/amd64 and linux/arm64\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.guard.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # One SBOM per platform manifest: the inventories differ, so a single amd64 SBOM
      # cannot describe the arm64 packages. Provenance covers the published index.
      - name: Attest the amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.guard.outputs.image }}
          subject-digest: ${{ steps.digests.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/platforms/sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.guard.outputs.image }}
          subject-digest: ${{ steps.digests.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/platforms/sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Create or publish the GitHub Release
        id: github-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN does not trigger another release workflow; image publishing stays in this run.
        run: python3 tools/publish_release.py
      - name: Update latest for the current stable release
        if: ${{ steps.github-release.outputs.latest == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.guard.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          latest_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest_release" = "$RELEASE_TAG" ]; then
            # Point latest at the tested multi-platform index; nothing is rebuilt.
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
            printf 'latest now points to %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipping latest: $RELEASE_TAG is not the current stable release."
          fi
      # GHCR creates the package private even for a public repository, and a private
      # package is useless to anyone deploying the released image anonymously. Visibility
      # is a package-settings change: the REST API supports only GET, DELETE and restore,
      # so this step verifies the result and names the manual fix instead of faking one.
      - name: Check the package can be pulled anonymously
        shell: bash
        run: |
          repository=${GITHUB_REPOSITORY,,}
          if curl --fail --silent --output /dev/null "https://ghcr.io/token?scope=repository:${repository}:pull"; then
            echo "ghcr.io/$repository is publicly pullable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::ghcr.io/$repository is not anonymously pullable. Set the package visibility to public once under the repository's package settings; no API endpoint changes container package visibility. Later releases inherit it."
          echo "Package visibility needs the one-time manual change described in docs/development.md#release-images." >> "$GITHUB_STEP_SUMMARY"
