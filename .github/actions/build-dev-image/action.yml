name: "Build development image"
description: "Build and load the growbook development Docker image with GHA layer caching"
inputs:
  scope:
    description: "Cache scope for layer caching"
    required: false
    default: "ci-development"
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build development and test image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: development
        load: true
        push: false
        provenance: false
        tags: growbook:development
        no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        cache-from: type=gha,scope=${{ inputs.scope }}
        cache-to: type=gha,scope=${{ inputs.scope }},mode=max
        github-token: ""
