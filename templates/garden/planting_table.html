{% load i18n %}
<ul class="record-list planting-list">
  {% for record in records %}
  <li class="register-row-group">
    {% include 'garden/row_toggle.html' with kind='planting' %}
    <div id="details-planting-{{ record.pk }}" class="register-expanded record-info" hidden>
      <div class="register-details" role="region" aria-label="{% translate 'Details' %}: {{ record.display_label }}" aria-live="polite"></div>
    </div>
  </li>
  {% endfor %}
</ul>
