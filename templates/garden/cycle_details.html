{% load i18n %}
{% if record %}
  {% include 'garden/planting_details.html' with cycle_panel=True %}
{% else %}
<section class="record-details">
  {% if inline %}<h2>{{ heading }}</h2>{% else %}<h1>{{ heading }}</h1>{% endif %}
  <p>{{ cycle.get_status_display }}</p>
  <a href="{% url 'garden:cycle-edit' cycle.pk %}">{% translate 'Edit cycle' %}</a>
</section>
{% endif %}
