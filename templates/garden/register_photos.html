{% load i18n %}
{% if record.photos.all %}
<div class="photo-grid register-photos">
  {% for photo in record.photos.all %}
  <figure>
    <a href="{{ photo.get_absolute_url }}{% if destination %}?next={{ destination|urlencode }}{% endif %}"><img src="{{ photo.thumbnail_url }}" loading="lazy" alt="{% if photo.caption %}{{ photo.caption }}{% else %}{% translate 'Register photo' %} {{ forloop.counter }}{% endif %}"></a>
    {% if photo.caption %}<figcaption>{{ photo.caption }}</figcaption>{% endif %}
    {% if not readonly %}
    <a href="{% url 'garden:photo-edit' photo.pk %}{% if destination %}?next={{ destination|urlencode }}{% endif %}">{% translate 'Edit photo details' %}</a>
    <a href="{% url 'garden:photo-delete' photo.pk %}{% if destination %}?next={{ destination|urlencode }}{% endif %}">{% translate 'Delete photo' %}</a>
    {% endif %}
  </figure>
  {% endfor %}
</div>
{% endif %}
