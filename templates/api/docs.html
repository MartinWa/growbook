{% load i18n static %}
{% get_current_language as language %}
<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% translate 'API documentation' %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/swagger-ui-5.36.0/swagger-ui.css' %}">
  <script src="{% static 'vendor/swagger-ui-5.36.0/swagger-ui-bundle.js' %}" defer></script>
  <script src="{% static 'js/api-docs.js' %}" defer></script>
</head>
<body>
  <div id="api-docs-swagger" data-schema-url="{% url 'api:schema' %}"></div>
</body>
</html>
