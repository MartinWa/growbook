{% load i18n %}
{% if active_filters %}
<div class="filter-chips" aria-label="{% translate 'Active filters' %}">
  {% for filter in active_filters %}
  {% if filter.url %}
  <a class="filter-chip" href="{{ filter.url }}" data-filter-link aria-label="{% translate 'Remove filter' %}: {{ filter.label }}: {{ filter.value }}"><span class="min-w-0">{{ filter.label }}: {{ filter.value }}</span><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-x"/></svg></a>
  {% else %}
  <span class="filter-chip">{{ filter.label }}: {{ filter.value }}</span>
  {% endif %}
  {% endfor %}
  <a class="btn btn-outline" href="{{ clear_filters_url }}" data-filter-link>{% translate 'Clear filters' %}</a>
</div>
{% endif %}
