{% load i18n %}
<form method="post" action="{% url 'set_language' %}" class="language-form" data-language-form>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label for="language">{% translate 'Language' %}</label>
  <select id="language" name="language">
    <option value="sv" {% if language == 'sv' %}selected{% endif %}>Svenska</option>
    <option value="en" {% if language == 'en' %}selected{% endif %}>English</option>
  </select>
  <button type="submit">{% translate 'Change' %}</button>
</form>
