# Optional override: publish the application on host loopback only, for a reverse
# proxy running on the host itself (for example a NAS proxy package or a native
# nginx or Caddy). Never bind this to 0.0.0.0; the proxy provides HTTPS.
services:
  growbook:
    ports:
      - "127.0.0.1:${GROWBOOK_HOST_PORT:-8000}:8000"
