[project]
name = "growbook"
version = "0.1.0"
description = "A private, self-hosted garden planner and photo diary."
readme = "README.md"
requires-python = ">=3.14.4,<3.15"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "GrowBook contributors" }]
dependencies = [
    "Django==5.2.18",
    "Pillow==13.0.0",
    "pillow-heif==1.8.1",
    "filelock==4.2.6",
    "tzdata==2026.6",
    "waitress==3.0.2",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "playwright==1.64.1",
    "polib==1.2.0",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "growbook.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not browser'"
markers = ["browser: real Chromium integration checks (install the browser first)"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["*/migrations/*", "local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
